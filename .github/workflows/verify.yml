name: Train, test, and preserve reproducible evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Train local model, test CLI and loopback API, rebuild evidence
        run: python verify.py
      - name: Evaluate context-disjoint synthetic holdout against majority baseline
        run: python evaluate.py
      - name: Verify committed learned parameters are reproducible
        run: git diff --exit-code -- model.json
      - name: Upload inspectable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-grass-evidence
          path: |
            docs/test-output.txt
            docs/http-checks.json
            docs/sample-predictions.json
            docs/synthetic-evaluation.json
            docs/demo.html
          retention-days: 14
