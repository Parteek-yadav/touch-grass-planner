name: Verify browser parity and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python, actual Node parity, CLI and loopback API
        run: python verify.py
      - name: Rebuild static bundle from trained parameters
        run: python build_site.py
      - name: Preserve learned-model and browser-bundle reproducibility
        run: git diff --exit-code -- model.json site/model-data.mjs
      - name: Upload tested static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved repository Pages site
        id: deployment
        uses: actions/deploy-pages@v4
